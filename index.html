<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coursework Archive</title>
  <style>
    :root{
      --bg:#f7f8fb; --card:#fff; --muted:#667085; --accent:#3b82f6;
      --radius:12px; --gap:14px; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    html,body{height:100%}
    body{margin:0;padding:28px;background:var(--bg);color:#0f172a}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
    h1{margin:0;font-size:20px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    select,input[type=search],button{padding:8px 10px;border-radius:10px;border:1px solid #e6e9f0;background:white}
    .toolbar{display:flex;gap:8px;align-items:center}
    .summary{color:var(--muted);font-size:13px;margin-top:6px}
    main{display:grid;grid-template-columns:320px 1fr;gap:20px}
    /* left nav */
    .nav{background:var(--card);padding:12px;border-radius:var(--radius);box-shadow:0 6px 18px rgba(16,24,40,0.06)}
    .nav h3{margin:0 0 8px 0;font-size:14px}
    .category-list{display:flex;flex-direction:column;gap:6px}
    .cat-btn{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
    .cat-btn.active{background:#eef2ff;border-color:#dbeafe}
    .count{font-size:12px;color:var(--muted)}
    /* right content */
    .content{min-height:60vh}
    .category-block{margin-bottom:18px}
    .category-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
    .course-panel{background:var(--card);border-radius:10px;padding:10px;box-shadow:0 6px 18px rgba(16,24,40,0.04)}
    .course-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
    .course-title{font-weight:700}
    .course-meta{font-size:12px;color:var(--muted)}
    .items{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .card{background:var(--card);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;border:1px solid #eef2f7}
    .thumb{width:100%;height:140px;object-fit:cover;background:#eef3ff;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
    .meta{padding:10px;font-size:13px}
    .title{font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .small{color:var(--muted);font-size:12px}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1f5f9;margin-right:6px;font-size:12px;color:#0f172a}
    /* lightbox */
    .lb{position:fixed;inset:0;background:rgba(4,6,18,0.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
    .lb.show{display:flex}
    .lb-box{max-width:1100px;max-height:90vh;background:#0b1220;border-radius:8px;overflow:auto;padding:12px}
    .lb-content{color:#fff}
    .lb img, .lb video, .lb iframe{max-width:100%;height:auto;display:block}
    .lb .info{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .btn{background:white;padding:8px 12px;border-radius:8px;text-decoration:none;color:#111;font-weight:600;display:inline-block}
    /* small */
    .muted{color:var(--muted)}
    @media (max-width:980px){main{grid-template-columns:1fr}}
    @media (max-width:520px){.thumb{height:110px}}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Coursework Archive</h1>
      <div class="summary" id="summary">Loading…</div>
    </div>

    <div class="controls">
      <div class="toolbar">
        <select id="filterCategory"><option value="">All categories</option></select>
        <select id="filterCourse"><option value="">All courses</option></select>
        <select id="sortBy">
          <option value="title">Sort: Title</option>
          <option value="course">Sort: Course</option>
        </select>
      </div>
      <input id="search" type="search" placeholder="Search title or filename..." />
    </div>
  </header>

  <main>
    <aside class="nav" aria-label="Navigation">
      <h3>Categories</h3>
      <div class="category-list" id="categoryList"></div>
      <hr style="margin:12px 0;border:none;border-top:1px solid #eef2f7">
      <div style="font-size:13px;color:var(--muted)">Tip: click a category to jump to it. Use search to filter items.</div>
    </aside>

    <section class="content" id="content"></section>
  </main>

  <div id="lightbox" class="lb" role="dialog" aria-hidden="true">
    <div class="lb-box">
      <div class="lb-content" id="lb-content"></div>
      <div class="lb-info" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;">
        <div id="lb-title" style="color:#fff;font-weight:600"></div>
        <div>
          <a id="lb-download" class="btn" href="#" download>Download</a>
          <button id="lb-close" class="btn" style="margin-left:8px">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Utility: safe encoded URL
    function safeURL(s){ return encodeURI(s); }

    // DOM refs
    const content = document.getElementById('content');
    const categoryList = document.getElementById('categoryList');
    const filterCategory = document.getElementById('filterCategory');
    const filterCourse = document.getElementById('filterCourse');
    const search = document.getElementById('search');
    const sortBy = document.getElementById('sortBy');
    const summary = document.getElementById('summary');

    let manifest = [];

    async function loadManifest(){
      try{
        const res = await fetch('manifest.json', {cache:'no-store'});
        if(!res.ok) throw new Error('manifest not found');
        manifest = await res.json();
      }catch(e){
        manifest = [];
      }
      buildUI();
    }

    function groupBy(arr, key){
      return arr.reduce((acc, it)=>{
        const k = it[key] || 'Unknown';
        (acc[k] ||= []).push(it);
        return acc;
      }, {});
    }

    function buildUI(){
      // normalise: ensure title and course exist
      manifest.forEach(m => { m.title = m.title || m.src; m.course = m.course || 'Misc'; m.category = m.category || 'Uncategorized'; });

      const byCategory = groupBy(manifest, 'category');
      // populate left nav
      categoryList.innerHTML = '';
      filterCategory.innerHTML = '<option value="">All categories</option>';
      for(const cat of Object.keys(byCategory).sort()){
        const btn = document.createElement('div'); btn.className='cat-btn';
        btn.textContent = cat;
        const cnt = document.createElement('span'); cnt.className='count muted'; cnt.textContent = byCategory[cat].length;
        btn.appendChild(cnt);
        btn.addEventListener('click',()=>{ location.hash = '#cat-'+encodeURIComponent(cat); });
        categoryList.appendChild(btn);

        const opt = document.createElement('option'); opt.value = cat; opt.textContent = `${cat} (${byCategory[cat].length})`;
        filterCategory.appendChild(opt);
      }

      // populate course filter with all courses
      const courses = Array.from(new Set(manifest.map(x=>x.course))).sort();
      filterCourse.innerHTML = '<option value="">All courses</option>';
      courses.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; filterCourse.appendChild(o); });

      render();
    }

    function render(){
      const q = search.value.trim().toLowerCase();
      const catFilter = filterCategory.value;
      const courseFilter = filterCourse.value;
      const sort = sortBy.value;

      // filter
      let items = manifest.filter(it=>{
        if(catFilter && it.category !== catFilter) return false;
        if(courseFilter && it.course !== courseFilter) return false;
        if(q){
          const hay = (it.title + ' ' + it.src + ' ' + (it.course||'')).toLowerCase();
          if(!hay.includes(q)) return false;
        }
        return true;
      });

      // sort
      items.sort((a,b)=>{
        if(sort === 'title') return a.title.localeCompare(b.title);
        return (a.course||'').localeCompare(b.course||'') || a.title.localeCompare(b.title);
      });

      summary.textContent = `${items.length} items — categories: ${Array.from(new Set(manifest.map(x=>x.category))).length}, courses: ${Array.from(new Set(manifest.map(x=>x.course))).length}`;

      // group by category -> course
      const byCategory = groupBy(items, 'category');

      content.innerHTML = '';
      for(const [cat, arr] of Object.entries(byCategory).sort((a,b)=>a[0].localeCompare(b[0]))){
        const catBlock = document.createElement('div'); catBlock.className='category-block';
        catBlock.id = 'cat-'+encodeURIComponent(cat);

        const header = document.createElement('div'); header.className='category-header';
        header.innerHTML = `<div style="display:flex;gap:10px;align-items:center"><strong>${cat}</strong><span class="muted">${arr.length} items</span></div>`;
        catBlock.appendChild(header);

        // courses grouping
        const byCourse = groupBy(arr, 'course');
        const coursesEl = document.createElement('div'); coursesEl.className='courses';

        for(const [course, itemsOfCourse] of Object.entries(byCourse).sort((a,b)=>a[0].localeCompare(b[0]))){
          const panel = document.createElement('div'); panel.className='course-panel';
          const head = document.createElement('div'); head.className='course-head';
          head.innerHTML = `<div><div class="course-title">${course}</div><div class="course-meta">${itemsOfCourse.length} item(s)</div></div><div style="font-size:13px;color:var(--muted)">▾</div>`;
          panel.appendChild(head);

          const itemsGrid = document.createElement('div'); itemsGrid.className='items';
          itemsOfCourse.forEach(it => {
            const card = document.createElement('div'); card.className='card';
            const ext = fileIcon(it.src);
            const thumb = document.createElement('div'); thumb.className='thumb';
            if(ext === 'image'){
              const img = document.createElement('img'); img.src = safeURL(it.src); img.alt = it.title; img.style.width='100%'; img.style.height='140px'; img.style.objectFit='cover';
              thumb.appendChild(img);
            } else if(ext === 'video'){
              const v = document.createElement('video'); v.src = safeURL(it.src); v.muted=true; v.loop=true; v.playsInline=true; v.autoplay=true; v.style.width='100%'; v.style.height='140px'; v.style.objectFit='cover';
              thumb.appendChild(v);
            } else {
              thumb.textContent = ext.toUpperCase();
            }
            const meta = document.createElement('div'); meta.className='meta';
            const title = document.createElement('div'); title.className='title'; title.title = it.title; title.textContent = it.title;
            const small = document.createElement('div'); small.className='small'; small.innerHTML = `<span class="badge">${it.category||''}</span><span class="badge">${it.course||''}</span>`;
            meta.appendChild(title); meta.appendChild(small);

            card.appendChild(thumb); card.appendChild(meta);
            card.addEventListener('click',()=>openLightbox(it));
            itemsGrid.appendChild(card);
          });

          panel.appendChild(itemsGrid);

          // collapse/expand
          head.addEventListener('click', ()=> {
            const isHidden = itemsGrid.style.display === 'none';
            itemsGrid.style.display = isHidden ? 'grid' : 'none';
            head.querySelector('div:last-child').textContent = isHidden ? '▾' : '▸';
          });

          coursesEl.appendChild(panel);
        }

        catBlock.appendChild(coursesEl);
        content.appendChild(catBlock);
      }

      if(Object.keys(byCategory).length === 0){
        content.innerHTML = '<div style="padding:24px;color:var(--muted)">No items found. Check manifest.json or try a different filter.</div>';
      }
    }

    function fileIcon(src){
      const ext = src.split('.').pop().toLowerCase();
      if(['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return 'image';
      if(['mp4','webm','ogg'].includes(ext)) return 'video';
      if(['pdf'].includes(ext)) return 'pdf';
      return 'file';
    }

    // Lightbox
    function openLightbox(item){
      const lb = document.getElementById('lightbox');
      const contentBox = document.getElementById('lb-content');
      const titleEl = document.getElementById('lb-title');
      const dl = document.getElementById('lb-download');
      contentBox.innerHTML = ''; titleEl.textContent = item.title || item.src;
      dl.href = safeURL(item.src); dl.download = item.title || '';

      const ext = fileIcon(item.src);
      if(ext==='image'){
        const img = document.createElement('img'); img.src = safeURL(item.src); contentBox.appendChild(img);
      } else if(ext==='video'){
        const v = document.createElement('video'); v.controls=true; v.src = safeURL(item.src); contentBox.appendChild(v);
      } else if(ext==='pdf'){
        const iframe = document.createElement('iframe'); iframe.src = safeURL(item.src); iframe.style.width='100%'; iframe.style.height='80vh'; contentBox.appendChild(iframe);
      } else {
        const info = document.createElement('div'); info.style.padding='24px'; info.style.color='#fff'; info.textContent = 'Preview not available. Use the download button.'; contentBox.appendChild(info);
      }
      lb.classList.add('show'); lb.setAttribute('aria-hidden','false');
    }

    document.getElementById('lb-close').addEventListener('click', ()=>{ const lb=document.getElementById('lightbox'); lb.classList.remove('show'); lb.setAttribute('aria-hidden','true'); document.getElementById('lb-content').innerHTML=''; });
    document.getElementById('lightbox').addEventListener('click',(e)=>{ if(e.target.id==='lightbox') { document.getElementById('lightbox').classList.remove('show'); document.getElementById('lb-content').innerHTML=''; } });

    [filterCategory, filterCourse, search, sortBy].forEach(el=>el.addEventListener('input', render));

    // Load on start
    loadManifest();
  </script>
</body>
</html>
