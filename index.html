cat > index.html <<'EOF'
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Coursework Archive — Folder view</title>
<style>
  :root{
    --bg:#f7f8fb; --card:#fff; --muted:#667085; --accent:#2563eb;
    --radius:12px; --gap:12px;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body{margin:0;padding:22px;background:var(--bg);color:#0f172a}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  h1{margin:0;font-size:20px}
  .controls{display:flex;gap:8px;align-items:center}
  input[type=search]{padding:8px;border-radius:10px;border:1px solid #e6e9f0;background:white}
  main{display:grid;grid-template-columns:330px 1fr;gap:18px}
  .tree{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(16,24,40,0.06);height:75vh;overflow:auto}
  .panel{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(16,24,40,0.04);min-height:75vh;overflow:auto}
  .folder {padding:6px 8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
  .folder:hover{background:#f1f5ff}
  .folder .name{font-weight:700;display:flex;align-items:center;gap:8px}
  .children{margin-left:12px;margin-top:6px;border-left:1px dashed rgba(0,0,0,0.03);padding-left:10px}
  .file{display:flex;flex-direction:column;border-radius:8px;overflow:hidden;border:1px solid #eef2f7;background:white;cursor:pointer}
  .file .thumb{height:140px;display:flex;align-items:center;justify-content:center;background:#eef3ff;font-weight:700;color:var(--muted)}
  .file .meta{padding:8px;font-size:13px}
  .title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .small{color:var(--muted);font-size:12px}
  .muted{color:var(--muted)}
  .badge{background:#eef2ff;color:#0b4dd8;padding:2px 8px;border-radius:999px;font-size:12px;margin-left:8px}
  /* caret */
  .caret{display:inline-block;width:12px;height:12px;transform:rotate(0deg);transition:transform .14s ease}
  .caret.open{transform:rotate(90deg)}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}
  .lb.show{display:flex}
  .lb-box{max-width:1100px;max-height:90vh;background:#071026;border-radius:8px;overflow:auto;padding:12px}
  .lb-content img,.lb-content video,.lb-content iframe{max-width:100%;height:auto;display:block}
  .lb-info{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:#fff}
  .btn{background:white;padding:8px 12px;border-radius:8px;text-decoration:none;color:#111;font-weight:600}
  @media (max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Coursework Archive</h1>
    <div class="muted" id="summary">Loading…</div>
  </div>
  <div class="controls">
    <input id="search" placeholder="Search title or filename..." type="search" />
  </div>
</header>

<main>
  <aside class="tree" id="tree" aria-label="Folder tree">Loading manifest…</aside>
  <section class="panel" id="panel">
    <div id="panel-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div><strong id="panel-path">All files</strong></div>
      <div><span id="panel-count" class="muted"></span></div>
    </div>
    <div id="files" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px"></div>
  </section>
</main>

<div id="lightbox" class="lb" role="dialog" aria-hidden="true">
  <div class="lb-box">
    <div class="lb-content" id="lb-content"></div>
    <div class="lb-info"><div id="lb-title"></div><div><a id="lb-download" class="btn" href="#" download>Download</a>&nbsp;<button id="lb-close" class="btn">Close</button></div></div>
  </div>
</div>

<script>
  const safe = s => encodeURI(s);
  const treeEl = document.getElementById('tree');
  const filesEl = document.getElementById('files');
  const panelPath = document.getElementById('panel-path');
  const panelCount = document.getElementById('panel-count');
  const search = document.getElementById('search');
  let manifest = [];

  async function loadManifest(){
    try{
      const res = await fetch('manifest.json', {cache:'no-store'});
      if(!res.ok) throw new Error('no manifest');
      manifest = await res.json();
    }catch(e){
      manifest = [];
    }
    manifest.forEach(m => { m.title = m.title || m.src; });
    buildTreeAndRender();
    document.getElementById('summary').textContent = `${manifest.length} items — folder view`;
  }

  function buildTree(items){
    const root = { type:'folder', name:'/', children: {} };
    items.forEach(it => {
      const parts = it.src.split('/').filter(p=>p.length>0);
      let node = root;
      for(let i=0;i<parts.length;i++){
        const part = parts[i];
        const isLeaf = (i === parts.length-1);
        if(isLeaf){
          node.children.files = node.children.files || [];
          node.children.files.push(Object.assign({}, it));
        } else {
          node.children[part] = node.children[part] || { type:'folder', name:part, children:{} };
          node = node.children[part];
        }
      }
    });
    return root;
  }

  // Render tree: this version only adds a single [files] button per folder (handled by renderTree itself)
  function renderTree(node, container, pathParts = []){
    Object.keys(node.children).sort((a,b)=>a.localeCompare(b)).forEach(key => {
      if(key === 'files') return;
      const child = node.children[key];
      const row = document.createElement('div');
      row.className = 'folder';
      const displayPath = [...pathParts, child.name].join('/');
      row.innerHTML = `<div class="name"><span class="caret">&#9656;</span><span style="margin-left:6px">${child.name}</span></div><div class="muted">${countFilesInNode(child)}</div>`;
      container.appendChild(row);

      // children container
      const sub = document.createElement('div'); sub.className='children'; sub.style.display='none';
      container.appendChild(sub);

      // click toggles children and renders them on first open
      row.addEventListener('click', ()=>{
        const open = sub.style.display === 'block';
        sub.style.display = open ? 'none' : 'block';
        row.querySelector('.caret').classList.toggle('open', !open);
        if(!open && sub.childElementCount === 0){
          renderTree(child, sub, [...pathParts, child.name]);
        }
      });
    });

    // Add a single "[files] n file(s)" button for THIS node if it has files
    if(node.children.files && node.children.files.length){
      const showBtn = document.createElement('div');
      showBtn.className = 'folder';
      showBtn.style.marginTop='6px';
      showBtn.innerHTML = `<div style="font-weight:700">[files] ${node.children.files.length} file(s)</div><div class="muted">open</div>`;
      container.appendChild(showBtn);
      showBtn.addEventListener('click',(e)=>{ e.stopPropagation(); showFiles(node, pathParts.join('/')); });
    }
  }

  function countFilesInNode(node){
    let c = 0;
    if(node.children && node.children.files) c += node.children.files.length;
    Object.keys(node.children||{}).forEach(k => {
      if(k === 'files') return;
      c += countFilesInNode(node.children[k]);
    });
    return c;
  }

  function showFiles(node, path){
    const files = node.children.files ? node.children.files : [];
    panelPath.textContent = path || '/';
    panelCount.textContent = `${files.length} file(s)`;
    filesEl.innerHTML = '';
    files.sort((a,b)=> (a.title||'').localeCompare(b.title||''));
    files.forEach(it => {
      const f = document.createElement('div'); f.className='file';
      const thumb = document.createElement('div'); thumb.className='thumb';
      const ext = (it.src.split('.').pop()||'').toLowerCase();
      if(['png','jpg','jpeg','gif','svg','webp'].includes(ext)){
        const img = document.createElement('img'); img.src = safe(it.src); img.alt = it.title; img.style.width='100%'; img.style.height='140px'; img.style.objectFit='cover';
        thumb.appendChild(img);
      } else if(['mp4','webm','ogg'].includes(ext)){
        const v = document.createElement('video'); v.src = safe(it.src); v.muted=true; v.loop=true; v.playsInline=true; v.autoplay=true; v.style.width='100%'; v.style.height='140px'; v.style.objectFit='cover';
        thumb.appendChild(v);
      } else {
        thumb.textContent = ext.toUpperCase();
      }
      const meta = document.createElement('div'); meta.className='meta';
      meta.innerHTML = `<div class="title" title="${escapeHtml(it.title)}">${it.title}</div><div class="small">${it.src}</div>`;
      f.appendChild(thumb); f.appendChild(meta);
      f.addEventListener('click', ()=> openLightbox(it));
      filesEl.appendChild(f);
    });
  }

  function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  function showRootFiles(root){
    const files = root.children.files || [];
    panelPath.textContent = '/ (repo root)';
    panelCount.textContent = `${files.length} file(s)`;
    filesEl.innerHTML = '';
    files.forEach(it=>{
      const f = document.createElement('div'); f.className='file';
      const thumb = document.createElement('div'); thumb.className='thumb';
      const ext = (it.src.split('.').pop()||'').toLowerCase();
      if(['png','jpg','jpeg','gif','svg','webp'].includes(ext)){
        const img = document.createElement('img'); img.src = safe(it.src); img.alt = it.title; img.style.width='100%'; img.style.height='140px'; img.style.objectFit='cover';
        thumb.appendChild(img);
      } else if(['mp4','webm','ogg'].includes(ext)){
        const v = document.createElement('video'); v.src = safe(it.src); v.muted=true; v.loop=true; v.playsInline=true; v.autoplay=true; v.style.width='100%'; v.style.height='140px'; v.style.objectFit='cover';
        thumb.appendChild(v);
      } else {
        thumb.textContent = ext.toUpperCase();
      }
      const meta = document.createElement('div'); meta.className='meta';
      meta.innerHTML = `<div class="title" title="${escapeHtml(it.title)}">${it.title}</div><div class="small">${it.src}</div>`;
      f.appendChild(thumb); f.appendChild(meta);
      f.addEventListener('click', ()=> openLightbox(it));
      filesEl.appendChild(f);
    });
  }

  function buildTreeAndRender(){
    const root = buildTree(manifest);
    treeEl.innerHTML = '';
    const rootBtn = document.createElement('div'); rootBtn.className='folder'; rootBtn.innerHTML = `<div style="font-weight:700">/ (repo root)</div><div class="muted">${countFilesInNode(root)} files</div>`;
    treeEl.appendChild(rootBtn);
    rootBtn.addEventListener('click', ()=> { showRootFiles(root); });
    renderTree(root, treeEl, []);
    showRootFiles(root);
  }

  function fileIcon(src){
    const ext = src.split('.').pop().toLowerCase();
    if(['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return 'image';
    if(['mp4','webm','ogg'].includes(ext)) return 'video';
    if(['pdf'].includes(ext)) return 'pdf';
    return 'file';
  }

  function openLightbox(item){
    const lb = document.getElementById('lightbox');
    const content = document.getElementById('lb-content');
    const title = document.getElementById('lb-title');
    const dl = document.getElementById('lb-download');
    content.innerHTML = ''; title.textContent = item.title || item.src; dl.href = safe(item.src); dl.download = item.title || '';
    const ext = fileIcon(item.src);
    if(ext==='image'){ const img = document.createElement('img'); img.src = safe(item.src); content.appendChild(img); }
    else if(ext==='video'){ const v = document.createElement('video'); v.controls=true; v.src = safe(item.src); content.appendChild(v); }
    else if(ext==='pdf'){ const iframe = document.createElement('iframe'); iframe.src = safe(item.src); iframe.style.width='100%'; iframe.style.height='80vh'; content.appendChild(iframe); }
    else{ const info = document.createElement('div'); info.style.padding='24px'; info.style.color='#fff'; info.textContent = 'Preview not available. Use download.'; content.appendChild(info); }
    lb.classList.add('show'); lb.setAttribute('aria-hidden','false');
  }

  document.getElementById('lb-close').addEventListener('click', ()=>{ const lb=document.getElementById('lightbox'); lb.classList.remove('show'); lb.setAttribute('aria-hidden','true'); document.getElementById('lb-content').innerHTML=''; });
  document.getElementById('lightbox').addEventListener('click',(e)=>{ if(e.target.id==='lightbox') { document.getElementById('lightbox').classList.remove('show'); document.getElementById('lb-content').innerHTML=''; } });

  search.addEventListener('input', ()=>{
    const q = search.value.trim().toLowerCase();
    if(!q){ buildTreeAndRender(); return; }
    const results = manifest.filter(it => ((it.title||'') + ' ' + it.src + ' ' + (it.course||'')).toLowerCase().includes(q));
    panelPath.textContent = `Search: "${q}" (${results.length})`;
    panelCount.textContent = `${results.length} result(s)`;
    filesEl.innerHTML = '';
    results.sort((a,b)=> (a.title||'').localeCompare(b.title||''));
    results.forEach(it=>{
      const f = document.createElement('div'); f.className='file';
      const thumb = document.createElement('div'); thumb.className='thumb';
      const ext = (it.src.split('.').pop()||'').toLowerCase();
      if(['png','jpg','jpeg','gif','svg','webp'].includes(ext)){
        const img = document.createElement('img'); img.src = safe(it.src); img.alt = it.title; img.style.width='100%'; img.style.height='140px'; img.style.objectFit='cover';
        thumb.appendChild(img);
      } else if(['mp4','webm','ogg'].includes(ext)){
        const v = document.createElement('video'); v.src = safe(it.src); v.muted=true; v.loop=true; v.playsInline=true; v.autoplay=true; v.style.width='100%'; v.style.height='140px'; v.style.objectFit='cover';
        thumb.appendChild(v);
      } else {
        thumb.textContent = ext.toUpperCase();
      }
      const meta = document.createElement('div'); meta.className='meta';
      meta.innerHTML = `<div class="title" title="${escapeHtml(it.title)}">${it.title}</div><div class="small">${it.src}</div>`;
      f.appendChild(thumb); f.appendChild(meta);
      f.addEventListener('click', ()=> openLightbox(it));
      filesEl.appendChild(f);
    });
  });

  loadManifest();
</script>
</body>
</html>
EOF
